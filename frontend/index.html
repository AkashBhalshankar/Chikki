<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Apply the saved or requested theme before the page paints, to avoid a dark flash.
      try {
        var q = new URLSearchParams(location.search).get("theme");
        var t = q === "light" || q === "dark" ? q : localStorage.getItem("chikki_theme");
        if (t === "light") document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    </script>
    <title>Chikki: Voice-First AI Career Assistant</title>
    <meta name="description" content="Chikki is a voice-first AI assistant that answers questions about Akash Bhalshankar, an AI Engineer. Every answer is checked against his verified resume." />
    <link rel="canonical" href="https://akashbhalshankar.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chikki" />
    <meta property="og:title" content="Chikki: Akash Bhalshankar's AI career assistant" />
    <meta property="og:description" content="Ask about his skills, projects and fit for your role, by voice or text. Every answer is checked against his verified resume." />
    <meta property="og:url" content="https://akashbhalshankar.com/" />
    <meta property="og:image" content="https://akashbhalshankar.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chikki, the robot assistant, with the text Ask Akash's AI career assistant" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chikki: Akash Bhalshankar's AI career assistant" />
    <meta name="twitter:description" content="Ask about his skills, projects and fit for your role. Every answer is checked against his verified resume." />
    <meta name="twitter:image" content="https://akashbhalshankar.com/og-image.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chikki" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Chikki">
        <div class="boot-bot"><i></i><i></i></div>
        <div class="boot-bar"><i></i></div>
        <p>Loading Chikki…</p>
      </div>
    </div>
    <noscript><p style="font-family:sans-serif;text-align:center;padding:2rem;color:#999">Chikki needs JavaScript to run. Please enable it and reload.</p></noscript>
    <script>
      // If the app has not started after a while (a slow connection or a blocked file), say so instead of waiting forever.
      setTimeout(function () {
        var boot = document.querySelector(".boot");
        if (!boot) return;
        boot.querySelector("p").textContent = "Taking longer than usual…";
        var button = document.createElement("button");
        button.textContent = "Reload";
        button.style.cssText = "margin-top:6px;padding:6px 14px;border-radius:8px;border:1px solid #7f77dd;background:transparent;color:#afa9ec;font:inherit;cursor:pointer";
        button.onclick = function () { location.reload(); };
        boot.appendChild(button);
      }, 15000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
