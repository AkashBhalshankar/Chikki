[project]
name = "chikki-backend"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "python-dotenv>=1.0.1",
    "edge-tts>=7.3.1",
    "pydantic>=2.9.2",
    "websockets>=13.1",
    "reportlab>=4.2.5",
    "pypdf>=5.0.0",
    "langfuse>=3.0.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.32",
    "openai>=3.16.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
