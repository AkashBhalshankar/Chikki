name: Keep Chikki warm

# Render's free tier puts the backend to sleep after a quiet spell, and the next visitor then waits up to a
# minute. Pinging /health every 10 minutes keeps it awake. Needs the repository secret BACKEND_URL
# (https://your-backend.onrender.com, no trailing slash); without it the job does nothing.
# GitHub may run scheduled jobs a few minutes late, which is fine for this.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL is not set; nothing to ping."
            exit 0
          fi
          curl --silent --show-error --retry 2 --retry-delay 15 --max-time 90 "$BACKEND_URL/health" || true
