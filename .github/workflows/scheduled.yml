name: Scheduled owner tasks

# Needs two repository secrets: BACKEND_URL (https://your-backend.onrender.com, no trailing slash)
# and ADMIN_TOKEN (the same value configured on the backend).
# Using GitHub's scheduler also wakes the Render free tier, so these work even when it is asleep.

on:
  schedule:
    - cron: "0 4 * * *"      # daily health check, 09:30 IST
    - cron: "30 3 * * 1"     # weekly digest, Mondays 09:00 IST
  workflow_dispatch:

jobs:
  ops-check:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 4 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Health check (alerts you if the resume or providers are broken)
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 120 \
            -X POST -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" \
            "${{ secrets.BACKEND_URL }}/ops/check"

  weekly-digest:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 3 * * 1'
    runs-on: ubuntu-latest
    steps:
      - name: Send weekly digest
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 120 \
            -X POST -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" \
            "${{ secrets.BACKEND_URL }}/digest/send?days=7"
